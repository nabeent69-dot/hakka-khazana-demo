name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare real cooking hero animation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 --connect-timeout 20             -A "Mozilla/5.0" -e "https://www.pexels.com/"             "https://videos.pexels.com/video-files/4926171/4926171-uhd_4096_2160_30fps.mp4"             -o /tmp/hero-source.mp4

          ffmpeg -y -i /tmp/hero-source.mp4 -t 10 -an             -vf "fps=15,scale=1280:-2:flags=lanczos"             -c:v libwebp -quality 72 -compression_level 4 -loop 0             assets/hero-wok.webp

          ffmpeg -y -i /tmp/hero-source.mp4 -frames:v 1             -vf "scale=1280:-2:flags=lanczos" -q:v 3             assets/hero-wok.jpg

          test -s assets/hero-wok.webp
          test -s assets/hero-wok.jpg

          curl -L --fail --retry 3 --connect-timeout 20             -A "Mozilla/5.0" -e "https://www.pexels.com/"             "https://videos.pexels.com/video-files/14584573/14584573-hd_1920_1080_25fps.mp4"             -o /tmp/signature-source.mp4

          ffmpeg -y -i /tmp/signature-source.mp4 -an             -vf "trim=start=0:end=16.9,setpts=1.18*PTS,fps=24,scale=1280:-2,eq=contrast=1.10:saturation=1.18:brightness=-0.015:gamma=0.98,colorbalance=rs=0.03:gs=0.01:bs=-0.02,vignette=PI/5,unsharp=5:5:0.5:5:5:0.0"             -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p             -movflags +faststart assets/signature-wok.mp4

          test -s assets/signature-wok.mp4
          ls -lh assets/hero-wok.webp assets/hero-wok.jpg assets/signature-wok.mp4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
